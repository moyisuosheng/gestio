<!doctype html>
<html><head><meta charset="utf-8"><title>Gestio gesture test</title>
<style>
  html,body{margin:0;background:#000;height:100%;overflow:hidden}
  #v{width:100vw;height:100vh;display:block;background:#222}
</style></head>
<body>
<video id="v" muted></video>
<script>
  window.__test = { seeks: [], rates: [], plays: 0 };
  const v = document.getElementById('v');
  // Fake a long-duration finite video so validVideo() accepts it.
  Object.defineProperty(v, 'duration', { get: () => 600 });
  Object.defineProperty(v, 'videoWidth', { get: () => 1280 });
  Object.defineProperty(v, 'videoHeight', { get: () => 720 });
  v.readyState = 4;
  v.paused = false;
  let _ct = 100;
  Object.defineProperty(v, 'currentTime', {
    get: () => _ct,
    set: (x) => { _ct = x; window.__test.seeks.push(x); },
    configurable: true
  });
  let _rate = 1;
  Object.defineProperty(v, 'playbackRate', {
    get: () => _rate,
    set: (x) => { _rate = x; window.__test.rates.push(x); },
    configurable: true
  });
  v.play = () => { v.paused = false; window.__test.plays++; return Promise.resolve(); };
  v.pause = () => { v.paused = true; };
  window.__video = v;
</script>
</body></html>
