<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestio</title>
<style>
  :root{color-scheme:light}
  body{width:300px;margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#1f2430;background:#f7f8fb}
  header{padding:12px 16px;background:linear-gradient(135deg,#5b6cff,#8a5bff);color:#fff;display:flex;align-items:center;gap:10px}
  header .brandic{display:flex;align-items:center;justify-content:center;width:30px;height:30px;flex:none;border-radius:10px;background:rgba(255,255,255,.2)}
  header h1{margin:0;font-size:16px;font-weight:650}
  header p{margin:2px 0 0;font-size:10.5px;opacity:.85}
  .sic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .wrap{padding:10px 14px 4px}
  .row{display:flex;align-items:center;justify-content:space-between;padding:8px 4px;border-bottom:1px solid #e9ebf2;font-size:13px}
  .row:last-child{border-bottom:0}
  .sw{position:relative;display:inline-block;width:38px;height:22px;flex:none}
  .sw input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:2}
  .row .lbl{cursor:pointer;flex:1}
  /* A-B pair. The panel switch has no meaning without the loop above it, so
     the two live in one card: the parent row, then an indented child row
     joined to it by a short rail. As flat siblings the second row read like an
     unrelated feature — and its state now belongs to the page, not the
     browser. */
  .group{margin:2px -4px 6px;padding:2px 4px;border-radius:12px;background:#fff;
    box-shadow:inset 0 0 0 1px #e9ebf2}
  .group>.row{border-bottom:0}
  .group>.row:first-child .lbl{font-weight:600}
  .row.sub{position:relative;margin-top:-2px;padding:7px 4px 8px 33px;color:#525a7a;border-bottom:0}
  .row.sub .lbl{font-size:12px}
  .row.sub:before{content:"";position:absolute;left:16px;top:-3px;height:56%;width:13px;
    border-left:1.5px solid #d9deee;border-bottom:1.5px solid #d9deee;border-bottom-left-radius:7px}
  .row.sub.is-off{opacity:.45}
  .row.sub.is-off .lbl{cursor:default}
  .slider{position:absolute;inset:0;background:#cbd0dd;border-radius:22px;transition:.2s;pointer-events:none}
  .slider:before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
  input:checked+.slider{background:#5b6cff}
  input:checked+.slider:before{transform:translateX(16px)}
  input:disabled{cursor:not-allowed}
  input:disabled+.slider{background:#d7dbe8}
  input:disabled:checked+.slider{background:#b9c0f2}
  .num{width:66px;padding:5px 7px;border:1px solid #d7dbe8;border-radius:7px;font-size:12px;text-align:right;background:#fff}
  /* The action row is sticky: Android shows this popup in a bottom sheet that is
     often a little shorter than the content, and scrolling to reach "All
     settings" was the first thing users hit. Pinning the bar means the three
     buttons are always on screen, whatever the sheet height turns out to be. */
  .btns{position:sticky;bottom:0;display:flex;gap:8px;margin:0 -14px;padding:9px 14px 11px;background:#f7f8fb;border-top:1px solid #e9ebf2;box-shadow:0 -6px 12px -8px rgba(31,36,48,.25)}
  button{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:9px 6px;border:0;border-radius:9px;background:#5b6cff;color:#fff;font-size:11.5px;cursor:pointer;white-space:nowrap}
  button .lbl{white-space:nowrap}
  button.ghost{background:#eceffa;color:#4a5170}
  button:disabled{opacity:.45;cursor:not-allowed}
  .status{margin:0 14px 4px;padding:8px 10px;border-radius:8px;font-size:11px;line-height:1.4;background:#eef7ee;color:#256029}
  .status.bad{background:#fff2e6;color:#9a4b00}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-hand" viewBox="0 0 24 24"><path d="M9 11V5.6a1.6 1.6 0 0 1 3.2 0V11"/><path d="M12.2 11V8.6a1.6 1.6 0 0 1 3.2 0V11"/><path d="M15.4 11.4V10a1.6 1.6 0 0 1 3.2 0v5.2A6.8 6.8 0 0 1 11.8 22h-1a5 5 0 0 1-4.3-2.5L4 15.6a1.7 1.7 0 0 1 2.7-2l2.3 2"/><path d="M9 18.5V13"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10.5" rx="2.4"/><path d="M8 10V7.2a4 4 0 0 1 8 0V10"/></symbol>
  <symbol id="i-unlock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10.5" rx="2.4"/><path d="M8 10V7.2a4 4 0 0 1 7.6-1.8"/></symbol>
  <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 5v14M12 3v18M20 6v12"/><circle cx="4" cy="10" r="1.8" fill="currentColor" stroke="none"/><circle cx="12" cy="15" r="1.8" fill="currentColor" stroke="none"/><circle cx="20" cy="11" r="1.8" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-reset" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></symbol>
</defs></svg>
<header>
  <div class="brandic"><svg class="sic" style="width:20px;height:20px"><use href="#i-hand"/></svg></div>
  <div><h1>Gestio</h1><p id="sub" data-i18n="Video gesture control">Video gesture control</p></div>
</header>
<div class="status" id="status" data-i18n="Checking this tab…">Checking this tab…</div>
<div class="wrap" id="rows">
  <div class="row"><span class="lbl" data-i18n="Enable gestures">Enable gestures</span><label class="sw" for="enabled"><input type="checkbox" id="enabled" data-k="enabled"><span class="slider"></span></label></div>
  <div class="row"><span class="lbl" data-i18n="Long-press speed boost">Long-press speed boost</span><label class="sw" for="longPressEnabled"><input type="checkbox" id="longPressEnabled" data-k="longPressEnabled"><span class="slider"></span></label></div>
  <div class="row"><span class="lbl" data-i18n="Swipe to seek">Swipe to seek</span><label class="sw" for="swipeSeekEnabled"><input type="checkbox" id="swipeSeekEnabled" data-k="swipeSeekEnabled"><span class="slider"></span></label></div>
  <div class="row"><span class="lbl" data-i18n="Double-tap actions">Double-tap actions</span><label class="sw" for="doubleTapEnabled"><input type="checkbox" id="doubleTapEnabled" data-k="doubleTapEnabled"><span class="slider"></span></label></div>
  <div class="row"><span class="lbl" data-i18n="Volume boost (&gt;100%)">Volume boost (&gt;100%)</span><label class="sw" for="volumeBoostEnabled"><input type="checkbox" id="volumeBoostEnabled" data-k="volumeBoostEnabled"><span class="slider"></span></label></div>
  <div class="group">
    <div class="row"><span class="lbl" data-i18n="A-B loop">A-B loop</span><label class="sw" for="abLoopEnabled"><input type="checkbox" id="abLoopEnabled" data-k="abLoopEnabled"><span class="slider"></span></label></div>
    <div class="row sub" id="abPanelRow"><span class="lbl" data-i18n="A-B control panel" data-i18n-title="Shown over the video. Turn it off to tuck it away on this page only — the loop keeps running.">A-B control panel</span><label class="sw" for="abPanelVisible"><input type="checkbox" id="abPanelVisible" checked><span class="slider"></span></label></div>
  </div>
  <div class="row"><span class="lbl" data-i18n="Gesture shield (anti-conflict)">Gesture shield (anti-conflict)</span><label class="sw" for="gestureShield"><input type="checkbox" id="gestureShield" data-k="gestureShield"><span class="slider"></span></label></div>
  <div class="row"><label for="longPressSpeed" data-i18n="Long-press speed">Long-press speed</label><input class="num" type="number" id="longPressSpeed" data-k="longPressSpeed" min="1.25" max="16" step="0.25"></div>
  <div class="btns">
    <button id="lockBtn"><svg class="sic"><use href="#i-lock"/></svg><span class="lbl" data-i18n="Lock video">Lock video</span></button>
    <button id="openOpts"><svg class="sic"><use href="#i-sliders"/></svg><span data-i18n="All settings">All settings</span></button>
    <button id="reset" class="ghost"><svg class="sic"><use href="#i-reset"/></svg><span data-i18n="Reset">Reset</span></button>
  </div>
</div>
<script src="i18n.js"></script>
<script src="popup.js"></script>
</body>
</html>
